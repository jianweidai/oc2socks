# .github/workflows/publish-image.yaml

name: Build and Push Docker Image to Docker Hub

# 1. 配置触发器：推送到 release 分支时触发，或手动触发
on:
  push:
    branches: [ "release" ]
  workflow_dispatch: # 允许手动执行工作流

# 2. 环境变量：定义镜像仓库和名称
env:
  # Docker Hub 用户名
  DOCKER_USER: errmercruz
  # 镜像名称
  IMAGE_NAME: oc2socks

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      # 3. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 4. 登录到 Docker Hub
      # 注意：你需要在 GitHub 仓库设置中添加 DOCKERHUB_TOKEN（建议使用 Access Token 而非原始密码）
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 提取元数据 (Tags, Labels)
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}
          tags: |
            # 为 release 分支添加 latest 标签
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/release' }}
            # 添加 Git commit SHA 作为标签
            type=sha,prefix=,format=short
            # 如果有 Git Tag 也会自动添加
            type=ref,event=tag

      # 6. 设置 Docker Buildx (支持多架构构建，可选)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. 构建并推送镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 缓存优化，加快后续构建速度
          cache-from: type=gha
          cache-to: type=gha,mode=max