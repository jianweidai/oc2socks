<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oc2socks 管理后台</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --success-color: #238636;
            --error-color: #da3633;
            --muted-color: #8b949e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            border: 1px solid #30363d;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--accent-color);
        }

        .info-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .info-label {
            color: var(--muted-color);
        }

        .info-value {
            font-family: monospace;
            color: var(--text-color);
        }

        .status-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .status-online {
            background-color: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
        }

        .status-offline {
            background-color: var(--error-color);
            box-shadow: 0 0 10px var(--error-color);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
            font-family: monospace;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--success-color);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 1rem;
        }

        button:hover {
            opacity: 0.8;
        }

        .btn-danger {
            background-color: var(--error-color);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 1rem;
        }

        .button-group button {
            flex: 1;
            margin-top: 0;
        }

        .log-area {
            background: black;
            color: #00ff00;
            padding: 10px;
            height: 120px;
            overflow-y: auto;
            font-size: 0.8rem;
            margin-top: 1.5rem;
            border-radius: 4px;
            font-family: "Courier New", Courier, monospace;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>oc2socks Admin</h1>

        <div class="info-card">
            <div class="info-item">
                <span class="info-label">VPN Server:</span>
                <span class="info-value" id="vpn-server">加载中...</span>
            </div>
            <div class="info-item">
                <span class="info-label">Active Token:</span>
                <span class="info-value" id="vpn-token">加载中...</span>
            </div>
        </div>

        <div class="status-box">
            <span>连接状态</span>
            <span id="status-text">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-label">正在检测...</span>
            </span>
        </div>

        <div class="form-group">
            <label>输入 Session Token 进行连接</label>
            <input type="text" id="token-input" placeholder="粘贴获取到的 Token...">
        </div>

        <div class="button-group">
            <button onclick="reconnect()">连接 / 重连</button>
            <button class="btn-danger" onclick="disconnect()">断开连接</button>
        </div>

        <div class="log-area" id="log-area">系统就绪，等待指令...</div>
    </div>

    <script>
        const key = new URLSearchParams(window.location.search).get('key');

        function updateStatus() {
            fetch(`/api/status?key=${key}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('vpn-server').innerText = data.vpn_server;
                    document.getElementById('vpn-token').innerText = data.masked_token;

                    const dot = document.getElementById('status-dot');
                    const label = document.getElementById('status-label');
                    if (data.online) {
                        dot.className = 'status-dot status-online';
                        label.innerText = '已连接';
                    } else {
                        dot.className = 'status-dot status-offline';
                        label.innerText = '未连接';
                    }
                });
        }

        function reconnect() {
            const token = document.getElementById('token-input').value;
            const log = document.getElementById('log-area');
            if (!token) { alert('请输入 Token'); return; }

            log.innerText += '\n[' + new Date().toLocaleTimeString() + '] 发起连接请求...';
            fetch(`/api/reconnect?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token })
            })
                .then(res => res.json())
                .then(data => {
                    log.innerText += '\n' + (data.message || data.error);
                    log.scrollTop = log.scrollHeight;
                    setTimeout(updateStatus, 3000);
                })
                .catch(err => {
                    log.innerText += '\n连接异常: ' + err;
                });
        }

        function disconnect() {
            const log = document.getElementById('log-area');

            if (!confirm('确定要断开 VPN 连接吗？')) {
                return;
            }

            log.innerText += '\n[' + new Date().toLocaleTimeString() + '] 正在断开连接...';
            fetch(`/api/disconnect?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
                .then(res => res.json())
                .then(data => {
                    log.innerText += '\n' + (data.message || data.error);
                    log.scrollTop = log.scrollHeight;
                    setTimeout(updateStatus, 1000);
                })
                .catch(err => {
                    log.innerText += '\n断开异常: ' + err;
                });
        }

        setInterval(updateStatus, 5000);
        updateStatus();
    </script>
</body>

</html>
